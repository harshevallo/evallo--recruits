<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Inter. preconnect shaves a round trip off the render-critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Per-page metadata (canonical, Open Graph, JSON-LD) is injected server-side for public
      routes — see ADR-004 and ADR-013. These are the document defaults.
    -->
    <title>Evallo Recruit | The Premier Hiring Platform for Educators</title>
    <meta
      name="description"
      content="Connect verified, high-performing tutors with premium educational organizations. The specialized hiring network for top educators."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
