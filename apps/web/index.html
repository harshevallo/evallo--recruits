<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Inter. preconnect shaves a round trip off the render-critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      These are the DOCUMENT DEFAULTS, and the fallback for every page.

      There is no SSR. This is a Vite SPA served as static files, so per-page metadata is written
      by `utils/pageMeta.js` after hydration. Googlebot renders JavaScript and sees it; social
      crawlers that fetch raw HTML — WhatsApp, Slack, LinkedIn — do not, and get the card below.
      An earlier version of this comment claimed the tags were "injected server-side"; they never
      were. See `pageMeta.js` for the limitation and what would actually fix it.
    -->
    <title>Evallo Recruit | The Premier Hiring Platform for Educators</title>
    <meta
      name="description"
      content="Connect verified, high-performing tutors with premium educational organizations. The specialized hiring network for top educators."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
